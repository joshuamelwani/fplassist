name: Refresh FPL data

on:
  schedule:
    # Every Wednesday 06:00 UTC and every Friday 09:00 UTC - covers press
    # conferences / team news ahead of most gameweeks. Adjust freely.
    - cron: "0 6 * * 3"
      # (second schedule kept separate below for clarity in the Actions UI)
    - cron: "0 9 * * 5"
  workflow_dispatch: {}   # lets you trigger a refresh manually from the Actions tab
  push:
    branches: [main]
    paths:
      - "scripts/**"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pulp

      - name: Fetch latest FPL data
        run: python scripts/fetch_data.py

      - name: Compute expected-points forecasts
        run: python scripts/xp_model.py

      - name: Run squad optimizer
        run: python scripts/optimizer.py

      - name: Commit refreshed data
        run: |
          git config user.name "fpl-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet && echo "No data changes" || git commit -m "Weekly data refresh: $(date -u +'%Y-%m-%d')"
          git push

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
